<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pojok Bahasa Inggris</title>
<meta name="theme-color" content="#4A47E0">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<script>
try{var th=localStorage.getItem('belajar-theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th)}catch(e){}
</script>
<style>
/* Layout: satu kolom. Atas: tautan kembali dan judul. Lalu deretan penanda untuk pindah permainan, lalu satu permainan memenuhi layar. */
:root{
  --bg:#F5F2FC;--card:#FFFFFF;--ink:#1E1938;--muted:#5A547C;--line:#DDD6F0;--on:#FFFFFF;
  --acc:#6D32D1;--acc-soft:#E8DEFF;--amber:#F29D00;--amber-soft:#FFEBC2;
  --good:#0E7F5A;--good-soft:#D5F3E6;--bad:#CC3329;--bad-soft:#FFE2DF;--star:#F5B000;
  --fd:'Fredoka','Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --fb:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16122B;--card:#211B40;--ink:#F0ECFF;--muted:#ADA6D0;--line:#382F63;--on:#16122B;
    --acc:#B796FF;--acc-soft:#33275E;--amber:#FFB43A;--amber-soft:#4A3A12;
    --good:#55D6A5;--good-soft:#143F39;--bad:#FF8479;--bad-soft:#4B2522;--star:#FFC933;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16122B;--card:#211B40;--ink:#F0ECFF;--muted:#ADA6D0;--line:#382F63;--on:#16122B;
  --acc:#B796FF;--acc-soft:#33275E;--amber:#FFB43A;--amber-soft:#4A3A12;
  --good:#55D6A5;--good-soft:#143F39;--bad:#FF8479;--bad-soft:#4B2522;--star:#FFC933;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:700 17px/1.55 var(--fb);
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:99px;background:var(--card);border:2px solid var(--line);text-decoration:none;font-weight:800;font-size:15px;flex:none}
.head h1{font:700 30px/1.1 var(--fd);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scroll-snap-type:x proximity}
.chip{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:2px solid var(--line);text-decoration:none;font-weight:800;font-size:15px;scroll-snap-align:start}
.chip[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:18px 16px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font:700 30px/1.15 var(--fd)}
.lead{color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font:600 18px var(--fd);background:var(--acc);color:var(--on);text-align:center}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:22px;height:22px;fill:currentColor;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted)}
.tabs2{display:flex;gap:8px;flex-wrap:wrap}
.tp{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;display:inline-flex;align-items:center}
.tp:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tp[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}

/* menu */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:22px;background:var(--acc-soft);text-decoration:none;min-width:0}
.tile .g{font:700 34px/1 var(--fd);color:var(--acc);min-height:40px;overflow-wrap:anywhere}
.tile b{font:600 20px/1.2 var(--fd)}
.tile span.s{font-size:14px;color:var(--muted)}

/* alfabet */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.lt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px;border-radius:18px;border:2px solid var(--line);background:var(--bg);text-align:center;min-width:0}
.lt:hover{border-color:var(--acc)}
.lt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.lt.on{background:var(--acc-soft);border-color:var(--acc)}
.lt .L{font:700 34px/1.1 var(--fd);color:var(--acc)}
.lt .e{font-size:30px;line-height:1.2}
.lt .w{font-size:14px;font-weight:800;overflow-wrap:anywhere}
.lt .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* kartu kilat */
.fc{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:260px;border-radius:26px;border:3px solid var(--acc);background:var(--acc-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 14px;text-align:center}
.fc:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fc .pic{font-size:110px;line-height:1.1}
.fc .pic.txt{font:700 84px/1.1 var(--fd);color:var(--acc);overflow-wrap:anywhere}
.fc .en{font:700 46px/1.15 var(--fd);overflow-wrap:anywhere}
.fc .ph{font-weight:800;color:var(--acc);background:var(--card);padding:2px 14px;border-radius:99px;font-size:17px}
.fc .id{color:var(--muted);font-size:20px}
.fc .hint{color:var(--muted);font-size:14px}
.meter{display:block;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.res{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:12px 0}
.res h3{font:700 28px/1.2 var(--fd)}
.stars{display:flex;gap:6px}
.stars svg{width:60px;height:60px}
.st-on{fill:var(--star)}.st-off{fill:var(--line)}

/* cocokkan */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1.05;border-radius:16px;border:3px solid var(--line);background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;min-width:0;font:600 20px/1.15 var(--fd);overflow-wrap:anywhere}
.mc:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mc.open{background:var(--card);color:var(--ink);border-color:var(--acc)}
.mc.pic{font-size:44px}
.mc.pic.txt{font:700 30px/1 var(--fd)}
.mc.done{background:var(--good-soft);border-color:var(--good);color:var(--ink);cursor:default}
.mc .q{font-size:30px;opacity:.9}
.stat{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}

/* percakapan */
.bubbles{display:flex;flex-direction:column;gap:10px}
.bb{all:unset;box-sizing:border-box;cursor:pointer;max-width:92%;padding:12px 16px;border-radius:20px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bb.l{align-self:flex-start;background:var(--acc-soft);border-bottom-left-radius:6px}
.bb.r{align-self:flex-end;background:var(--amber-soft);border-bottom-right-radius:6px}
.bb.on{outline:3px solid var(--acc)}
.bb small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bb .e{font:600 22px/1.3 var(--fd);overflow-wrap:anywhere}
.bb .i{font-size:15px;color:var(--muted)}

/* kamus */
.search{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:3px solid var(--line);background:var(--bg);font-size:18px}
.dict{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.dr{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:var(--bg);min-height:62px}
.dr:hover{border-color:var(--acc)}
.dr:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dr .p{flex:none;width:44px;text-align:center;font-size:32px;line-height:1.1}
.dr .p.txt{font:700 20px var(--fd);color:var(--acc)}
.dr .t{flex:1;min-width:0}
.dr .t b{display:block;font:600 21px/1.2 var(--fd);overflow-wrap:anywhere}
.dr .t span{font-size:14px;color:var(--muted)}
.dr .sp{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.dr .sp svg{width:20px;height:20px;fill:currentColor}
.nosound{background:var(--amber-soft);border-radius:14px;padding:10px 14px;font-size:15px}


/* kegiatan tambahan */
.msg{border-radius:16px;padding:12px 16px;font-weight:800}
.msg.good{background:var(--good-soft)}.msg.try{background:var(--amber-soft)}.msg.info{background:var(--acc-soft)}
.qp{font:600 28px/1.25 var(--fd);overflow-wrap:anywhere}
.qp.big{font-size:44px;color:var(--acc);text-align:center}
.qv{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.qv .pic{font-size:96px;line-height:1.1}
.qv .pic.txt{font:700 72px/1.1 var(--fd);color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{all:unset;box-sizing:border-box;cursor:pointer;min-height:64px;padding:8px 10px;border-radius:16px;border:3px solid var(--line);background:var(--card);font:600 22px/1.2 var(--fd);display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;min-width:0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opts.emo .opt{font-size:52px;min-height:88px}
.opts.wide .opt{font:700 20px/1.4 var(--fb);justify-content:flex-start;text-align:left;padding:12px 16px}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.dim{opacity:.45}
.say{text-align:center;color:var(--muted)}
.blanks{text-align:center;font:700 34px/1.2 var(--fd);letter-spacing:.15em;color:var(--acc);overflow-wrap:anywhere}
#dform{display:flex;gap:10px;flex-wrap:wrap}
#dform .search{flex:1;min-width:150px}
.ex{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:64px;padding:10px;border-radius:18px;background:var(--acc-soft);border-bottom:4px solid var(--acc)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile2{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;padding:0 14px;border-radius:14px;background:var(--card);border:3px solid var(--acc);font:600 21px/1 var(--fd);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--acc)}
.tile2:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tile2.ghost{visibility:hidden}
.tile2.fin{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good);cursor:default}
.phd{width:48px;height:48px;border-radius:14px;border:3px dashed var(--acc);opacity:.5}

/* rapi: kelompok menu */
:root{--warm:#9A5200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warm:var(--amber)}}
:root[data-theme="dark"]{--warm:var(--amber)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{font:800 13px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp .tile{position:relative;padding:14px;gap:2px}
.grp .tile .g{font-size:28px;min-height:34px}
.grp .tile b{font-size:19px}
.grp.gb .tile{background:var(--amber-soft)}.grp.gb .tile .g{color:var(--warm)}
.grp.gc .tile{background:var(--good-soft)}.grp.gc .tile .g{color:var(--good)}
.grp.gd .tile{background:var(--bg);border:2px solid var(--line)}
.tile:hover{filter:brightness(.97)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.badge{position:absolute;top:10px;right:10px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.panel{gap:20px}
@media (min-width:700px){
  .chips{flex-wrap:wrap;overflow:visible}
  .wrap{max-width:860px}
  .panel{padding:24px 24px 28px}
  .grp .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:480px){
  .head h1{font-size:26px}
  .fc .pic{font-size:92px}
  .fc .en{font-size:38px}
  .mc.pic{font-size:36px}
  .opts{grid-template-columns:1fr}
  .opts.emo{grid-template-columns:repeat(3,minmax(0,1fr))}
  .qp.big{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head"><a class="back" href="index.html#inggris">&larr; Menu</a><h1>Pojok Bahasa Inggris</h1></header>
  <nav class="chips" id="nav" aria-label="Pilih kegiatan"></nav>
  <main id="view" class="panel"></main>
</div>
<script src="kata.js"></script>
<script>
(function(){
'use strict';
var K=window.KATA;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};

/* penyimpanan: kata yang sudah dikuasai dan skor terbaik cocokkan */
var KEY='inggris-kelas2';
var store={known:{},match:{},kuis:{},dikte:{},cerita:{},tata:{},kalimat:{}};
try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw){store.known=raw.known||{};store.match=raw.match||{};store.kuis=raw.kuis||{};store.dikte=raw.dikte||{};store.cerita=raw.cerita||{};store.tata=raw.tata||{};store.kalimat=raw.kalimat||{}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

/* suara */
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function say(list,onEach,onEnd){
  if(!canSpeak)return;
  if(typeof list==='string')list=[list];
  try{
    speechSynthesis.cancel();
    list.forEach(function(t,i){
      var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;
      u.onstart=function(){if(onEach)onEach(i)};
      if(i===list.length-1&&onEnd)u.onend=onEnd;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var STAR_PTS='12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26';
function stars(n){var h='<div class="stars" role="img" aria-label="'+n+' dari 3 bintang">';for(var i=0;i<3;i++)h+='<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="'+STAR_PTS+'" class="'+(i<n?'st-on':'st-off')+'" stroke-linejoin="round"/></svg>';return h+'</div>'}
var NOSND='<p class="nosound">Perangkat ini belum bisa mengeluarkan suara. Minta orang tua membacakan kata-katanya, lalu tirukan bersama.</p>';

function topic(id){var r=null;K.topics.forEach(function(t){if(t.id===id)r=t});return r}
function kk(t,w){return t.id+':'+w[0]}
function picHtml(t,w,cls){return '<span class="'+cls+(t.text?' txt':'')+'" aria-hidden="true">'+esc(w[2])+'</span>'}
function topicPills(cur,act,only){
  var h='<div class="tabs2" role="group" aria-label="Pilih topik">';
  K.topics.forEach(function(t){if(only&&!only(t))return;h+='<button class="tp" data-act="'+act+'" data-id="'+t.id+'" aria-pressed="'+(t.id===cur?'true':'false')+'">'+esc(t.name)+'</button>'});
  return h+'</div>';
}

/* ---------- tampilan ---------- */
var VIEWS=[['menu','Menu'],['alfabet','Alfabet'],['kartu','Kartu kilat'],['cocok','Cocokkan'],['kuis','Kuis kata'],['dikte','Dikte'],['cerita','Cerita'],['tata','Tata bahasa'],['kalimat','Susun kalimat'],['cakap','Percakapan'],['kamus','Kamus gambar']];
var view=$('#view'),cur='menu';
var S={}; /* state per tampilan */

function renderNav(){
  var h='';
  VIEWS.forEach(function(v){h+='<a class="chip" href="#'+v[0]+'" aria-current="'+(v[0]===cur?'page':'false')+'">'+v[1]+'</a>'});
  $('#nav').innerHTML=h;
}
function route(){
  var h=(location.hash||'').replace('#','');
  cur=VIEWS.some(function(v){return v[0]===h})?h:'menu';
  try{if(canSpeak)speechSynthesis.cancel()}catch(e){}
  renderNav();
  R=null;
  ({menu:vMenu,alfabet:vAlfabet,kartu:vKartu,cocok:vCocok,kuis:vKuis,dikte:vDikte,cerita:vCerita,tata:vTata,kalimat:vKalimat,cakap:vCakap,kamus:vKamus})[cur]();
  window.scrollTo(0,0);
}

function vMenu(){
  var GR=[
   ['Belajar kata','a',[['alfabet','A-Z','Alfabet','Huruf dan bunyinya'],['kartu','Flip','Kartu kilat','Balik kartu, tandai yang bisa'],['kamus','Aa','Kamus gambar','Cari kata, dengar suaranya'],['cocok','Pair','Cocokkan','Pasangkan gambar dan kata']]],
   ['Latihan dan kuis','b',[['kuis','Quiz','Kuis kata','10 soal, dapat bintang'],['dikte','Spell','Dikte','Dengar lalu ketik'],['kalimat','I am','Susun kalimat','Urutkan kata'],['tata','a / an','Tata bahasa','Aturan mini dan latihan']]],
   ['Membaca dan bicara','c',[['cakap','Chat','Percakapan','Dengar dan tirukan'],['cerita','Story','Cerita pendek','Baca, dengar, jawab']]]
  ];
  var cnt=function(o){var n=0;for(var k in o)if(o[k])n++;return n};
  var st=function(n){return n?n+' \u2605':''};
  var info={kuis:st(store.kuis.all),dikte:st(store.dikte.all),kalimat:st(store.kalimat.all),cerita:cnt(store.cerita)?cnt(store.cerita)+'/'+K.stories.length:'',tata:cnt(store.tata)?cnt(store.tata)+'/'+K.grammar.length:'',kartu:cnt(store.known)?cnt(store.known)+' kata':''};
  var h='<h2>Mau latihan apa?</h2><p class="lead">Dengarkan dulu, lalu tirukan keras-keras.</p>'+(canSpeak?'':NOSND);
  GR.forEach(function(g){
    h+='<section class="grp g'+g[1]+'"><h3>'+g[0]+'</h3><div class="tiles">';
    g[2].forEach(function(t){h+='<a class="tile" href="#'+t[0]+'"><span class="g" aria-hidden="true">'+t[1]+'</span><b>'+t[2]+'</b><span class="s">'+t[3]+'</span>'+(info[t[0]]?'<span class="badge">'+info[t[0]]+'</span>':'')+'</a>'});
    h+='</div></section>';
  });

/* cocokkan */
function vCocok(){
  if(!S.c)newMatch('hewan');
  drawMatch();
}
function newMatch(id){
  var t=topic(id),items=shuffle(t.items).slice(0,6),cards=[];
  items.forEach(function(w,i){cards.push({p:i,kind:'pic',w:w});cards.push({p:i,kind:'word',w:w})});
  S.c={topic:id,cards:shuffle(cards),open:[],matched:{},moves:0,lock:false,pairs:items.length};
}
function matchedCount(){var n=0;for(var p in S.c.matched)n++;return n}
function drawMatch(){
  var c=S.c,t=topic(c.topic),finished=matchedCount()===c.pairs;
  var h='<h2>Cocokkan gambar dan kata</h2>'+topicPills(c.topic,'ctopic',function(x){return x.items.length>=6})+'<div class="stat"><span>Langkah: '+c.moves+'</span><span>Pasangan: '+matchedCount()+' dari '+c.pairs+'</span></div><div class="board">';
  c.cards.forEach(function(cd,i){
    var isOpen=c.open.indexOf(i)>=0,isDone=!!c.matched[cd.p],show=isOpen||isDone;
    var cls='mc'+(show?' open':'')+(isDone?' done':'')+(show&&cd.kind==='pic'?' pic'+(t.text?' txt':''):'');
    h+='<button class="'+cls+'" data-act="mcard" data-i="'+i+'"'+(isDone?' disabled':'')+' aria-label="'+(show?(cd.kind==='pic'?'Gambar '+esc(cd.w[1]):esc(cd.w[0])):'Kartu tertutup')+'">'+(show?(cd.kind==='pic'?esc(cd.w[2]):esc(cd.w[0])):'<span class="q" aria-hidden="true">?</span>')+'</button>';
  });
  h+='</div>';
  if(finished){
    var n=c.moves<=9?3:(c.moves<=14?2:1),best=store.match[c.topic];
    if(!best||c.moves<best){store.match[c.topic]=c.moves;persist()}
    h+='<div class="res">'+stars(n)+'<h3>Semua pasangan ketemu!</h3><p class="note">'+c.moves+' langkah'+(best&&best<=c.moves?'. Terbaikmu: '+best+' langkah.':'.')+'</p><button class="btn" data-act="cagain">Main lagi</button></div>';
  }else h+='<p class="note">Buka dua kartu. Kalau gambar dan katanya cocok, kartu tetap terbuka.</p>';
  view.innerHTML=h+(canSpeak?'':NOSND);
}
function pickCard(i){
  var c=S.c;
  if(c.lock||c.open.indexOf(i)>=0||c.matched[c.cards[i].p])return;
  c.open.push(i);
  if(c.open.length<2){drawMatch();return}
  c.moves++;
  var a=c.cards[c.open[0]],b=c.cards[c.open[1]];
  if(a.p===b.p&&a.kind!==b.kind){
    c.matched[a.p]=true;c.open=[];drawMatch();say(a.w[0]);
  }else{
    c.lock=true;drawMatch();
    setTimeout(function(){if(S.c!==c)return;c.open=[];c.lock=false;if(cur==='cocok')drawMatch()},950);
  }
}

function stars3(score,total){var r=total?score/total:0;return r>=0.85?3:(r>=0.6?2:1)}
function tpill(label,act,id,sel){return '<button class="tp" data-act="'+act+'" data-id="'+id+'" aria-pressed="'+(sel?'true':'false')+'">'+label+'</button>'}
function starTxt(n){return n?' · '+n+'★':''}
function topicWords(id){
  var r=[];
  K.topics.forEach(function(t){if(id==='all'||t.id===id)t.items.forEach(function(w){r.push({t:t,w:w})})});
  return r;
}
function pickN(a,n){var s=shuffle(a),out=[];for(var i=0;i<n;i++)out.push(s[i%s.length]);return out}
function shuffleDiff(a){var s=shuffle(a),n=0;while(s.join('|')===a.join('|')&&n<20){s=shuffle(a);n++}return s}
function scrollRun(){var el=$('#run');try{if(el)el.scrollIntoView({block:'start',behavior:'smooth'})}catch(e){}}

/* pelari soal pilihan ganda */
var R=null;
function runStart(qs,meta){
  R={qs:qs,i:0,score:0,tries:0,state:'ask',wrong:{},fb:null,meta:meta,missed:[]};
  runDraw();scrollRun();
  if(qs[0]&&qs[0].auto)say(qs[0].auto);
}
function resultHtml(run,total,againAct){
  var n=stars3(run.score,total);
  var h='<div class="res">'+stars(n)+'<h3>'+run.score+' dari '+total+' benar di percobaan pertama</h3>';
  if(run.missed.length){
    h+='<p class="note">Kata yang perlu diulang. Tekan untuk mendengar:</p><div class="tabs2" style="justify-content:center">';
    run.missed.forEach(function(w){h+='<button class="tp" data-act="hsay" data-t="'+esc(w)+'">'+esc(w)+'</button>'});
    h+='</div>';
  }
  return h+'<div class="row" style="justify-content:center"><button class="btn" data-act="'+againAct+'">Main lagi</button></div></div>';
}
function runDraw(){
  var el=$('#run');if(!el||!R)return;
  if(R.i>=R.qs.length){el.innerHTML=R.meta.finish();return}
  var q=R.qs[R.i];
  var h='<div class="stat"><span>Soal '+(R.i+1)+' dari '+R.qs.length+'</span><span>Benar: '+R.score+'</span></div><span class="meter" aria-hidden="true"><i style="width:'+Math.round(R.i/R.qs.length*100)+'%"></i></span>';
  h+='<h3 class="qp'+(q.big?' big':'')+'">'+esc(q.prompt)+'</h3>';
  if(q.sub)h+='<p class="note">'+esc(q.sub)+'</p>';
  if(q.visual)h+='<div class="qv">'+q.visual+'</div>';
  if(q.speak&&canSpeak)h+='<div class="row"><button class="btn alt" data-act="rhear">'+SPK+esc(q.speakLabel||'Dengar')+'</button></div>';
  h+='<div class="opts '+(q.optClass||'')+'">';
  q.opts.forEach(function(o,i){
    var c='opt',dis=false;
    if(R.state!=='ask'){dis=true;c+=o.v===q.ans?' correct':(R.wrong[o.v]?' wrong':' dim')}
    else if(R.wrong[o.v]){c+=' wrong';dis=true}
    h+='<button class="'+c+'" data-act="ropt" data-i="'+i+'"'+(dis?' disabled':'')+'>'+o.h+'</button>';
  });
  h+='</div>';
  if(R.fb){
    h+='<div class="msg '+R.fb.k+'" role="status">'+esc(R.fb.t)+'</div>';
    if(R.state!=='ask')h+='<div class="row"><button class="btn" data-act="rnext">'+(R.i===R.qs.length-1?'Selesai':'Lanjut')+'</button></div>';
  }
  el.innerHTML=h;
}
function runAnswer(i){
  var q=R.qs[R.i],o=q.opts[i];
  if(o.v===q.ans){
    if(R.tries===0)R.score++;
    R.state='right';
    R.fb={k:'good',t:(R.tries===0?'Benar! ':'Benar, kali ini berhasil. ')+(q.explain||'')};
    if(q.after)say(q.after);
  }else{
    if(R.tries===0&&q.word)R.missed.push(q.word);
    R.tries++;R.wrong[o.v]=true;
    if(R.tries>=2){R.state='reveal';R.fb={k:'try',t:'Tidak apa-apa. '+(q.explain||'')};if(q.after)say(q.after)}
    else R.fb={k:'try',t:'Belum tepat. Petunjuk: '+(q.hint||'Coba sekali lagi.')};
  }
  runDraw();
}
function runNext(){
  R.i++;R.tries=0;R.state='ask';R.wrong={};R.fb=null;
  runDraw();
  var q=R.qs[R.i];if(q&&q.auto)say(q.auto);
}

function buildWordQ(pool,it,type){
  var w=it.w,t=it.t;
  var same=shuffle(pool.filter(function(x){return x.t.id===t.id&&x.w[0]!==w[0]}));
  var other=shuffle(pool.filter(function(x){return x.t.id!==t.id}));
  var cands=same.concat(other);
  var key={pic2en:function(x){return x.w[0]},en2id:function(x){return x.w[1]},id2en:function(x){return x.w[0]},hear:function(x){return x.w[2]}}[type];
  var ans=key(it),vals=[ans];
  for(var i=0;i<cands.length&&vals.length<3;i++){var v=key(cands[i]);if(vals.indexOf(v)<0)vals.push(v)}
  var q={opts:shuffle(vals).map(function(v){return {v:v,h:esc(v)}}),ans:ans,word:w[0],explain:w[0]+' = '+w[1]+' (cara baca: '+w[3]+')',after:w[0],hint:'Kata ini diawali huruf "'+w[0][0]+'".'};
  if(type==='pic2en'){q.prompt='Apa bahasa Inggrisnya?';q.visual='<span class="pic'+(t.text?' txt':'')+'" aria-hidden="true">'+esc(w[2])+'</span>'}
  else if(type==='en2id'){q.prompt=w[0];q.big=true;q.speak=w[0]}
  else if(type==='id2en'){q.prompt='Bahasa Inggris dari "'+w[1]+'" adalah ...'}
  else{q.prompt='Dengarkan, lalu pilih gambarnya';q.speak=w[0];q.speakLabel='Dengar lagi';q.auto=w[0];q.optClass=t.text?'':'emo';q.hint='Tekan dengar lagi dan perhatikan bunyi pertamanya.'}
  return q;
}
function wordQuestions(topicId,n){
  var pool=topicWords(topicId),picks=pickN(pool,n),types=canSpeak?['pic2en','en2id','id2en','hear']:['pic2en','en2id','id2en'],order=[],qs=[];
  for(var i=0;i<n;i++){if(i%types.length===0)order=shuffle(types);qs.push(buildWordQ(pool,picks[i],order[i%types.length]))}
  return qs;
}

function blanks(len,first){var a=[];for(var i=0;i<len;i++)a.push(i===0&&first?first:'_');return a.join(' ')}

  h+='<div class="blanks" aria-live="polite">'+(done?esc(en.split('').join(' ')):blanks(en.length,run.tries>=1?en[0]:''))+'</div>';
  if(showPic)h+='<div class="qv"><span class="pic'+(it.t.text?' txt':'')+'" aria-hidden="true">'+esc(it.w[2])+'</span></div><p class="say">'+esc(it.w[1])+'</p>';

  }
  view.innerHTML=h;
  var inp=$('#dk');if(inp&&!done)inp.focus();
}
function dikteSubmit(){
  var run=S.x.run;if(!run||run.state!=='ask')return;
  var it=run.qs[run.i],en=it.w[0],got=($('#dk').value||'').trim().toLowerCase();

    say(en);
  }else{
    if(run.tries===0)run.missed.push(en);
    run.tries++;
    if(run.tries>=2){run.state='reveal';run.fb={k:'try',t:'Tidak apa-apa. Katanya: '+en+' ('+it.w[3]+').'};say(en)}
    else run.fb={k:'try',t:'Belum tepat. Petunjuk: huruf pertamanya "'+en[0]+'" dan ada '+en.length+' huruf. Lihat gambarnya.'};
  }
  drawDikte();
}

  h+='</div><div class="row">'+(canSpeak?'<button class="btn" data-act="sall">'+SPK+'Bacakan cerita</button>':'')+'<button class="btn alt" data-act="shide">'+(S.s.hide?'Tampilkan artinya':'Sembunyikan artinya')+'</button></div><div class="bubbles" id="sbub">';
  st.lines.forEach(function(l,i){
    h+='<button class="bb l" data-act="sline" data-i="'+i+'"><span class="e">'+esc(l[0])+'</span>'+(S.s.hide?'':'<span class="i">'+esc(l[1])+'</span>')+'</button>';
  });
  h+='</div><div class="row"><button class="btn good" data-act="sq">Jawab pertanyaan</button></div><div id="run"></div>'+(canSpeak?'':NOSND);
  view.innerHTML=h;
}
function markStory(i){var els=document.querySelectorAll('#sbub .bb');for(var k=0;k<els.length;k++)els[k].classList.toggle('on',k===i)}
function storyQs(st){
  return st.qs.map(function(q){
    return {prompt:q[0],sub:q[1],speak:q[0],speakLabel:'Dengar pertanyaan',opts:shuffle([q[2]].concat(q[3])).map(function(v){return {v:v,h:esc(v)}}),ans:q[2],optClass:'wide',
      hint:'Baca lagi ceritanya pelan-pelan dan cari kalimat yang menjawab.',explain:'Jawabannya: '+q[2]+'.',after:q[2]};
  });
}

/* tata bahasa */
function vTata(){S.t=S.t||{id:K.grammar[0].id};drawTata()}
function curLesson(){var r=K.grammar[0];K.grammar.forEach(function(x){if(x.id===S.t.id)r=x});return r}
function drawTata(){
  var g=curLesson(),h='<h2>Tata bahasa</h2><div class="tabs2" role="group" aria-label="Pilih pelajaran">';
  K.grammar.forEach(function(x){h+=tpill(esc(x.title)+starTxt(store.tata[x.id]),'ts',x.id,x.id===g.id)});
  h+='</div><div class="msg info"><b>'+esc(g.title)+'</b><br>'+esc(g.rule)+'</div><ul class="ex">';
  g.examples.forEach(function(e){h+='<li><button class="dr" data-act="dsay" data-t="'+esc(e[0])+'"><span class="t"><b>'+esc(e[0])+'</b><span>'+esc(e[1])+'</span></span>'+(canSpeak?'<span class="sp">'+SPK+'</span>':'')+'</button></li>'});
  view.innerHTML=h+'</ul><div class="row"><button class="btn" data-act="tstart">Mulai latihan</button></div><div id="run"></div>'+(canSpeak?'':NOSND);
}
function grammarQs(g){
  return shuffle(g.items).slice(0,6).map(function(it){
    var filled=it[0].replace('___',it[2]).replace(/^\([^)]*\)\s*/,'');
    return {prompt:it[0],big:it[0].length<=14,opts:shuffle(it[1]).map(function(v){return {v:v,h:esc(v)}}),ans:it[2],hint:it[3],explain:it[3]+' Kalimat lengkap: '+filled,after:filled};
  });
}

/* susun kalimat */
function vKalimat(){S.y=S.y||{run:null};S.y.run=null;drawKalimat()}
function startKalimat(){
  var qs=shuffle(K.sentences).slice(0,8).map(function(s){var ws=s[0].split(' ');return {en:s[0],id:s[1],words:ws,tiles:shuffleDiff(ws)}});
  S.y.run={qs:qs,i:0,score:0,tries:0,state:'ask',placed:[],fb:null,missed:[]};
  drawKalimat();
}
function drawKalimat(){
  var run=S.y.run,h;
  if(!run){
    view.innerHTML='<h2>Susun kalimat</h2><p class="lead">Urutkan kata-kata menjadi kalimat yang benar. Artinya ditulis sebagai petunjuk.</p><div class="row"><button class="btn" data-act="ystart">Mulai (8 kalimat)</button></div>';
    return;
  }
  if(run.i>=run.qs.length){
    var n=stars3(run.score,run.qs.length);
    if(n>(store.kalimat.all||0)){store.kalimat.all=n;persist()}
    view.innerHTML='<h2>Susun kalimat</h2>'+resultHtml(run,run.qs.length,'ystart');
    return;
  }
  var q=run.qs[run.i],done=run.state!=='ask',total=q.words.length,i;
  h='<h2>Susun kalimat</h2><div class="stat"><span>Kalimat '+(run.i+1)+' dari '+run.qs.length+'</span><span>Benar: '+run.score+'</span></div><span class="meter" aria-hidden="true"><i style="width:'+Math.round(run.i/run.qs.length*100)+'%"></i></span>';
  h+='<p class="lead">Artinya: <b style="color:var(--ink)">'+esc(q.id)+'</b></p><div class="slots" id="slots">';
  for(i=0;i<total;i++){
    if(i<run.placed.length)h+='<button class="tile2'+(run.state==='right'?' fin':'')+'" data-act="yun" data-p="'+i+'"'+(done?' disabled':'')+'>'+esc(q.tiles[run.placed[i]])+'</button>';
    else h+='<span class="phd"></span>';
  }
  h+='</div><div class="bank">';
  q.tiles.forEach(function(t,idx){h+=run.placed.indexOf(idx)>=0?'<span class="tile2 ghost">'+esc(t)+'</span>':'<button class="tile2" data-act="ypl" data-i="'+idx+'"'+(done?' disabled':'')+'>'+esc(t)+'</button>'});
  h+='</div>';
  if(!done)h+='<div class="row"><button class="btn" data-act="ycheck"'+(run.placed.length===total?'':' disabled')+'>Periksa</button><button class="btn alt" data-act="yclear">Ulangi</button>'+(canSpeak&&run.tries>=1?'<button class="btn alt" data-act="yhear">'+SPK+'Dengar kalimatnya</button>':'')+'</div>';
  if(run.fb){
    h+='<div class="msg '+run.fb.k+'" role="status">'+esc(run.fb.t)+'</div>';
    if(done)h+='<div class="row"><button class="btn" data-act="ynext">'+(run.i===run.qs.length-1?'Selesai':'Lanjut')+'</button></div>';
  }
  view.innerHTML=h;
}
function kalimatOrder(q){
  var used={},out=[];
  q.words.forEach(function(w){for(var i=0;i<q.tiles.length;i++){if(!used[i]&&q.tiles[i]===w){used[i]=1;out.push(i);break}}});
  return out;
}

/* ---------- aksi untuk kegiatan tambahan ---------- */
document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='dform'){e.preventDefault();dikteSubmit()}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),i=Number(t.getAttribute('data-i'));
  if(a==='hsay')return say(t.getAttribute('data-t'));
  if(a==='ropt'){if(R&&R.state==='ask')runAnswer(i);return}
  if(a==='rnext'){if(R)runNext();return}
  if(a==='rhear'){var rq=R&&R.qs[R.i];if(rq&&rq.speak)say(rq.speak);return}
  /* kuis kata */
  if(a==='zt'){S.z.topic=id;return drawKuis()}
  if(a==='zstart'){
    runStart(wordQuestions(S.z.topic,10),{finish:function(){var n=stars3(R.score,R.qs.length);if(n>(store.kuis[S.z.topic]||0)){store.kuis[S.z.topic]=n;persist()}return resultHtml(R,R.qs.length,'zstart')}});
    return;
  }
  /* dikte */
  if(a==='xt'){S.x.topic=id;return drawDikte()}
  if(a==='xstart'){
    var pool=dictPool(S.x.topic);
    S.x.run={qs:pickN(pool,8),i:0,score:0,tries:0,state:'ask',fb:null,missed:[]};
    drawDikte();
    if(canSpeak)say(S.x.run.qs[0].w[0]);
    return;
  }
  if(a==='xhear'){var xr=S.x.run;if(xr)say(xr.qs[xr.i].w[0]);return}
  if(a==='xnext'){var r2=S.x.run;r2.i++;r2.tries=0;r2.state='ask';r2.fb=null;drawDikte();if(r2.i<r2.qs.length)say(r2.qs[r2.i].w[0]);return}
  /* cerita */
  if(a==='cs'){S.s.id=id;R=null;return drawCerita()}
  if(a==='shide'){S.s.hide=!S.s.hide;R=null;return drawCerita()}
  if(a==='sline'){var st=curStory();markStory(i);return say(st.lines[i][0],null,function(){markStory(-1)})}
  if(a==='sall'){var st2=curStory();return say(st2.lines.map(function(l){return l[0]}),function(k){markStory(k)},function(){markStory(-1)})}
  if(a==='sq'){
    var st3=curStory();
    runStart(storyQs(st3),{finish:function(){var v=1+R.score;if(v>(store.cerita[st3.id]||0)){store.cerita[st3.id]=v;persist()}return resultHtml(R,R.qs.length,'sq')}});
    return;
  }
  /* tata bahasa */
  if(a==='ts'){S.t.id=id;R=null;return drawTata()}
  if(a==='tstart'){
    var g=curLesson();
    runStart(grammarQs(g),{finish:function(){var n=stars3(R.score,R.qs.length);if(n>(store.tata[g.id]||0)){store.tata[g.id]=n;persist()}return resultHtml(R,R.qs.length,'tstart')}});
    return;
  }
  /* susun kalimat */
  if(a==='ystart'){startKalimat();return}
  var yr=S.y&&S.y.run;
  if(yr&&yr.i<yr.qs.length){
    var q=yr.qs[yr.i];
    if(a==='ypl'&&yr.state==='ask'){if(yr.placed.length<q.words.length){yr.placed.push(i);yr.fb=null;drawKalimat()}return}
    if(a==='yun'&&yr.state==='ask'){yr.placed.splice(Number(t.getAttribute('data-p')),1);yr.fb=null;drawKalimat();return}
    if(a==='yclear'&&yr.state==='ask'){yr.placed=[];yr.fb=null;drawKalimat();return}
    if(a==='yhear'){say(q.en);return}
    if(a==='ycheck'&&yr.state==='ask'){
      var got=yr.placed.map(function(k){return q.tiles[k]}).join(' ');
      if(got===q.en){
        if(yr.tries===0)yr.score++;
        yr.state='right';yr.fb={k:'good',t:(yr.tries===0?'Benar! ':'Benar, kali ini berhasil. ')+q.en};say(q.en);
      }else{
        if(yr.tries===0)yr.missed.push(q.words[0]);
        yr.tries++;
        if(yr.tries>=2){yr.state='reveal';yr.placed=kalimatOrder(q);yr.fb={k:'try',t:'Tidak apa-apa. Kalimat yang benar: '+q.en};say(q.en)}
        else{yr.fb={k:'try',t:'Belum tepat. Petunjuk: kalimat diawali kata "'+q.words[0]+'". Tekan Ulangi untuk menyusun lagi.'}}
      }
      return drawKalimat();
    }
    if(a==='ynext'){yr.i++;yr.tries=0;yr.state='ask';yr.placed=[];yr.fb=null;return drawKalimat()}
  }
});

/* ---------- aksi ---------- */
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){S.q.text=e.target.value;drawDict()}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),i=Number(t.getAttribute('data-i'));
  if(a==='letter')return sayLetter(i);
  if(a==='alla'){
    var seq=[];K.letters.forEach(function(l){seq.push(l[1]);seq.push(l[2])});
    return say(seq,function(k){mark(Math.floor(k/2))},function(){mark(-1)});
  }
  if(a==='ktopic'){buildDeck(id);return drawKartu()}
  if(a==='kreset'){var tt=topic(S.k.topic);tt.items.forEach(function(w){delete store.known[kk(tt,w)]});persist();buildDeck(S.k.topic);return drawKartu()}
  if(a==='flip'){S.k.flipped=!S.k.flipped;drawKartu();if(S.k.flipped)say(S.k.deck[0][0]);return}
  if(a==='khear')return say(S.k.deck[0][0]);
  if(a==='kagain'){S.k.deck.push(S.k.deck.shift());S.k.flipped=false;return drawKartu()}
  if(a==='kknow'){var tk=topic(S.k.topic),w=S.k.deck.shift();store.known[kk(tk,w)]=true;persist();S.k.flipped=false;return drawKartu()}
  if(a==='ctopic'){newMatch(id);return drawMatch()}
  if(a==='cagain'){newMatch(S.c.topic);return drawMatch()}
  if(a==='mcard')return pickCard(i);
  if(a==='dsel'){S.d.id=id;return drawDialog()}
  if(a==='dhide'){S.d.hide=!S.d.hide;return drawDialog()}
  if(a==='dline'){markLine(i);return say(curDialog().lines[i][1],null,function(){markLine(-1)})}
  if(a==='dall'){return say(curDialog().lines.map(function(l){return l[1]}),function(k){markLine(k)},function(){markLine(-1)})}
  if(a==='qtopic'){S.q.topic=id;return vKamus()}
  if(a==='dsay')return say(t.getAttribute('data-t'));
});
window.addEventListener('hashchange',route);
route();
})();
</script>
